name: Gem Automation via Stories

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  farm-gems:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Farm Gems via Duolingo API
        shell: bash
        run: |
          set +e

          echo "💎 Starting Gem farming via Story completion..."

          JWT="${{ secrets.DUOLINGO_TOKEN }}"
          if [ -z "$JWT" ]; then
            echo "❌ ERROR: DUOLINGO_TOKEN secret is not set"
            exit 1
          fi

          # 1. Извлекаем userId из JWT (без запросов к API)
          echo "🔍 Extracting user ID from JWT..."

          JWT_PAYLOAD=$(echo "$JWT" | cut -d'.' -f2)
          JWT_PAYLOAD_PADDED=$(echo "$JWT_PAYLOAD" | tr '_-' '/+' | awk '{
            l = length($0) % 4
            if (l == 2) print $0 "=="
            else if (l == 3) print $0 "="
            else print $0
          }')

          JWT_DECODED=$(echo "$JWT_PAYLOAD_PADDED" | base64 -d 2>/dev/null)
          echo "📥 JWT payload (first 200 chars): ${JWT_DECODED:0:200}"

          USER_ID=$(echo "$JWT_DECODED" | grep -o '"sub":[0-9]*' | grep -o '[0-9]*' || true)

          if [ -z "$USER_ID" ]; then
            echo "❌ ERROR: Could not extract user ID from JWT."
            echo "💡 The token may be malformed or expired."
            exit 1
          fi
          echo "✅ User ID: ${USER_ID}"

          # 2. Настройки
          FROM_LANG="en"
          TO_LANG="fr"
          STORY_SLUG="fr-en-le-passeport"
          TARGET_XP_PER_CYCLE=500
          MAX_CYCLES=20

          echo "🚀 Farming $TARGET_XP_PER_CYCLE XP per cycle..."

          # 3. Функции
          complete_story() {
            local now=$(date +%s)
            local dur=$((RANDOM % 60 + 120))
            curl -s -X POST "https://stories.duolingo.com/api2/stories/${STORY_SLUG}/complete" \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --max-time 30 \
              -d "{
                \"awardXp\": true,
                \"completedBonusChallenge\": true,
                \"fromLanguage\": \"${FROM_LANG}\",
                \"learningLanguage\": \"${TO_LANG}\",
                \"hasXpBoost\": false,
                \"illustrationFormat\": \"svg\",
                \"isFeaturedStoryInPracticeHub\": true,
                \"isLegendaryMode\": true,
                \"isV2Redo\": false,
                \"isV2Story\": false,
                \"masterVersion\": true,
                \"maxScore\": 0,
                \"score\": 0,
                \"happyHourBonusXp\": 469,
                \"startTime\": ${now},
                \"endTime\": $((now + dur))
              }"
          }

          check_gems() {
            local response=$(curl -s "https://www.duolingo.com/2023-05-23/users/${USER_ID}?fields=rewardBundles{rewards}" \
              -H "Authorization: Bearer ${JWT}" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --max-time 30)
            echo "$response" | grep -o '"id":"SKILL_COMPLETION[^"]*"' | sed 's/"id":"//;s/"//g' || true
          }

          claim_gem() {
            local reward_id=$1
            curl -s -X PATCH "https://www.duolingo.com/2023-05-23/users/${USER_ID}/rewards/${reward_id}" \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --max-time 30 \
              -d '{"consumed":true}'
          }

          # 4. Основной цикл
          TOTAL_GEMS=0
          CYCLE=0

          while [ $CYCLE -lt $MAX_CYCLES ]; do
            CYCLE=$((CYCLE + 1))
            echo "--- Cycle $CYCLE/$MAX_CYCLES ---"

            echo "📤 Farming XP..."
            XP_GAINED=0
            STORY_COUNT=0
            FAIL_COUNT=0

            while [ $XP_GAINED -lt $TARGET_XP_PER_CYCLE ] && [ $FAIL_COUNT -lt 5 ]; do
              RESPONSE=$(complete_story)
              AWARD=$(echo "$RESPONSE" | grep -o '"awardedXp":[0-9]*' | grep -o '[0-9]*' || true)

              if [ -n "$AWARD" ] && [ "$AWARD" != "0" ]; then
                XP_GAINED=$((XP_GAINED + AWARD))
                STORY_COUNT=$((STORY_COUNT + 1))
                FAIL_COUNT=0
                echo "  ✅ +${AWARD} XP (${XP_GAINED}/${TARGET_XP_PER_CYCLE})"
              else
                FAIL_COUNT=$((FAIL_COUNT + 1))
                echo "  ⚠️  Failed (${FAIL_COUNT}/5). Response: ${RESPONSE:0:150}"
                sleep 2
              fi
              sleep 0.5
            done

            echo "✅ Farmed ${XP_GAINED} XP via ${STORY_COUNT} stories"

            echo "⏳ Waiting for rewards..."
            sleep 5

            echo "🔍 Checking rewards..."
            REWARD_IDS=$(check_gems)

            if [ -z "$REWARD_IDS" ]; then
              echo "ℹ️ No rewards yet. Waiting longer..."
              sleep 10
              REWARD_IDS=$(check_gems)
            fi

            if [ -n "$REWARD_IDS" ]; then
              echo "🎯 Claiming rewards..."
              CLAIMED_COUNT=0
              for RID in $REWARD_IDS; do
                if [ -z "$RID" ]; then continue; fi
                RESPONSE=$(claim_gem "$RID")
                if echo "$RESPONSE" | grep -q '"gems"'; then
                  GEMS=$(echo "$RESPONSE" | grep -o '"gems":[0-9]*' | grep -o '[0-9]*' || true)
                  TOTAL_GEMS=$((TOTAL_GEMS + GEMS))
                  CLAIMED_COUNT=$((CLAIMED_COUNT + 1))
                  echo "  💎 +${GEMS} gems (total: ${TOTAL_GEMS})"
                else
                  echo "  ⚠️  Could not claim ${RID}: ${RESPONSE:0:100}"
                fi
                sleep 0.3
              done
              echo "✅ Claimed ${CLAIMED_COUNT} rewards"
            else
              echo "ℹ️ No rewards available."
            fi

            if [ $CYCLE -lt $MAX_CYCLES ]; then
              sleep 5
            fi
          done

          echo ""
          echo "📊 ================================"
          echo "📊 Total gems: ${TOTAL_GEMS}"
          echo "📊 Cycles: ${CYCLE}"
          echo "📊 ================================"
          echo "✨ Done at: $(date -u '+%H:%M:%S UTC')"
